name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: leadpilot
          POSTGRES_PASSWORD: leadpilot
          POSTGRES_DB: leadpilot
        ports: ['5433:5432']
        options: --health-cmd "pg_isready -U leadpilot" --health-interval 2s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 20
    env:
      DATABASE_URL: postgres://leadpilot:leadpilot@localhost:5433/leadpilot
      REDIS_URL: redis://localhost:6380
      API_INTERNAL_KEY: ci-internal-key-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Migrations apply to an empty database
        run: pnpm db:migrate
