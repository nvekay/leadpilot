# Local Postgres and Redis for development and integration tests
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: leadpilot
      POSTGRES_PASSWORD: leadpilot
      POSTGRES_DB: leadpilot
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U leadpilot']
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    # BullMQ needs keys to survive memory pressure
    command: ['redis-server', '--maxmemory-policy', 'noeviction']
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
